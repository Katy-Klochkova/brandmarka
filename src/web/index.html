<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brandmarka</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Inter, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1A1A1A;
    }
    h1 { color: #003366; }
    h2 { margin-top: 32px; color: #003366; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      margin-top: 16px;
      padding: 12px 24px;
      background: #003366;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #004080; }
    .section {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-top: 16px;
    }
    .status { margin-top: 12px; color: #059669; }
  </style>
</head>
<body>
  <h1>Brandmarka</h1>
  <p>Генератор фирменных материалов: визитки, презентации, коммерческие предложения.</p>

  <div class="section">
    <h2>1. Загрузить бренд-бук</h2>
    <label for="brandbookFile">Файл brandbook.json</label>
    <input type="file" id="brandbookFile" accept=".json">
    <button onclick="uploadBrandbook()">Загрузить</button>
    <div class="status" id="brandbookStatus"></div>
  </div>

  <div class="section">
    <h2>2. Визитка сотрудника</h2>
    <label>ФИО</label>
    <input type="text" id="bcName" value="Иванов Иван Иванович">
    <label>Должность</label>
    <input type="text" id="bcPosition" value="Руководитель отдела продаж">
    <label>Телефон</label>
    <input type="text" id="bcPhone" value="+7 900 123-45-67">
    <label>Email</label>
    <input type="text" id="bcEmail" value="ivanov@techdiagnostika.ru">
    <label>Telegram</label>
    <input type="text" id="bcTelegram" value="@ivanov_td">
    <button onclick="generateBusinessCard()">Скачать визитку</button>
  </div>

  <div class="section">
    <h2>3. Email-подпись</h2>
    <label>ФИО</label>
    <input type="text" id="signName" value="Иванов Иван Иванович">
    <label>Должность</label>
    <input type="text" id="signPosition" value="Руководитель отдела продаж">
    <label>Телефон</label>
    <input type="text" id="signPhone" value="+7 900 123-45-67">
    <label>Email</label>
    <input type="text" id="signEmail" value="ivanov@techdiagnostika.ru">
    <label>Telegram</label>
    <input type="text" id="signTelegram" value="@ivanov_td">
    <button onclick="generateEmailSignature()">Скачать подпись</button>
  </div>

  <div class="section">
    <h2>4. Клиентская презентация</h2>
    <label>Клиент</label>
    <input type="text" id="presClient" value="ООО РоторПром">
    <label>Цель проекта</label>
    <input type="text" id="presGoal" value="внедрение системы онлайн-вибродиагностики">
    <label>Ключевые тезисы (через Enter)</label>
    <textarea id="presPoints" rows="4">15 лет опыта
более 200 внедрений
собственное производство
поддержка 24/7</textarea>
    <button onclick="generatePresentation()">Скачать презентацию</button>
  </div>

  <div class="section">
    <h2>4. Коммерческое предложение</h2>
    <label>Клиент</label>
    <input type="text" id="propClient" value="ООО РоторПром">
    <label>Услуги (название — цена, каждая с новой строки)</label>
    <textarea id="propServices" rows="4">Поставка системы — 1250000
Монтаж и пусконаладка — 280000
Обучение персонала — 120000</textarea>
    <label>Сроки</label>
    <input type="text" id="propTerms" value="30 рабочих дней">
    <label>Условия оплаты</label>
    <input type="text" id="propPayment" value="50/50">
    <button onclick="generateProposal()">Скачать КП</button>
  </div>

  <script>
    async function uploadBrandbook() {
      const file = document.getElementById('brandbookFile').files[0];
      if (!file) return alert('Выберите файл brandbook.json');
      const form = new FormData();
      form.append('brandbook', file);
      const res = await fetch('/api/brandbook', { method: 'POST', body: form });
      const data = await res.json();
      document.getElementById('brandbookStatus').textContent =
        data.status === 'ok' ? `Бренд-бук ${data.company} загружен` : 'Ошибка загрузки';
    }

    function downloadFromResponse(res, filename) {
      if (!res.ok) return alert('Ошибка генерации');
      res.blob().then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    }

    async function generateBusinessCard() {
      const payload = {
        full_name: document.getElementById('bcName').value,
        position: document.getElementById('bcPosition').value,
        phone: document.getElementById('bcPhone').value,
        email: document.getElementById('bcEmail').value,
        telegram: document.getElementById('bcTelegram').value,
      };
      const form = new FormData();
      form.append('payload', JSON.stringify(payload));
      const res = await fetch('/api/business-card', { method: 'POST', body: form });
      downloadFromResponse(res, 'business_card.png');
    }

    async function generateEmailSignature() {
      const payload = {
        full_name: document.getElementById('signName').value,
        position: document.getElementById('signPosition').value,
        phone: document.getElementById('signPhone').value,
        email: document.getElementById('signEmail').value,
        telegram: document.getElementById('signTelegram').value,
      };
      const form = new FormData();
      form.append('payload', JSON.stringify(payload));
      const res = await fetch('/api/email-signature', { method: 'POST', body: form });
      downloadFromResponse(res, 'email_signature.html');
    }

    async function generatePresentation() {
      const payload = {
        client_name: document.getElementById('presClient').value,
        project_goal: document.getElementById('presGoal').value,
        key_points: document.getElementById('presPoints').value.split('\n').filter(Boolean),
      };
      const form = new FormData();
      form.append('payload', JSON.stringify(payload));
      const res = await fetch('/api/presentation', { method: 'POST', body: form });
      downloadFromResponse(res, 'presentation.pptx');
    }

    async function generateProposal() {
      const services = document.getElementById('propServices').value
        .split('\n')
        .filter(Boolean)
        .map(line => {
          const [name, price] = line.split('—').map(s => s.trim());
          return { name, price: parseInt(price.replace(/\s/g, ''), 10) || 0 };
        });
      const payload = {
        client_name: document.getElementById('propClient').value,
        services,
        terms: document.getElementById('propTerms').value,
        payment: document.getElementById('propPayment').value,
      };
      const form = new FormData();
      form.append('payload', JSON.stringify(payload));
      const res = await fetch('/api/proposal', { method: 'POST', body: form });
      downloadFromResponse(res, 'proposal.docx');
    }
  </script>
</body>
</html>
